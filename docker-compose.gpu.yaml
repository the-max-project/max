# docker-compose.gpu.yaml
# Override file that adds NVIDIA GPU reservations.
# Append with: -f docker-compose.gpu.yaml

services:
  stt:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
