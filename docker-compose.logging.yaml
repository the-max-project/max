# docker-compose.logging.yaml
# Override file that adds Loki logging driver to all services.
# Uses explicit per-service definitions (no deprecated YAML merge keys).

services:
  stt:
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-batch-size: "400"
        mode: "non-blocking"
        loki-external-labels: "version=${APP_VERSION:-latest}"
    depends_on:
      loki:
        condition: service_started

