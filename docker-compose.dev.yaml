# docker-compose.dev.yaml
# Dev-only overrides: bind mounts, live reload commands

services:
  stt:
    volumes:
      - ./services/max-stt:/app
    command: python -m uvicorn src.app:app --reload --log-level ${STT_LOG_LEVEL:-info}

  assistant:
    volumes:
      - ./services/max-assistant:/app
    command: >
      sh -c "pip install -e . && \
             python -m uvicorn max_assistant.main:app \
             --reload-dir /app/src \
             --reload-exclude '*__pycache__*' \
             --log-config log_config.json \ 
             --host 0.0.0.0 --port 80"

  proxy:
    volumes:
      - ./proxy:/proxy
      - node_modules:/proxy/node_modules

  ollama:
    environment:
      - OLLAMA_MAX_LOADED_MODELS=3
