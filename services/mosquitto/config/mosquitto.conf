# Standard MQTT listener for internal Docker & LAN devices
listener 1883 0.0.0.0

# WebSocket listener (optional, useful if web UI/dashboards connect directly)
listener 9001 0.0.0.0
protocol websockets

# Allow anonymous connections for local/home network use
# (Change to false and configure password_file if authentication is required)
allow_anonymous true

# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information